<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>360° Virtual Tour Player</title>
    <style>
        html, body {
            margin: 0; padding: 0; width: 100%; height: 100%;
            overflow: hidden; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #000;
        }
        #viewer-container {
            width: 100%; height: 100%; position: absolute; top: 0; left: 0;
        }
        #tour-overlay-ui {
            position: absolute; top: 20px; left: 20px; z-index: 10;
            pointer-events: none; display: flex; flex-direction: column; gap: 5px;
        }
        .project-badge {
            background: rgba(0, 0, 0, 0.75); color: #00bcd4; padding: 10px 18px;
            border-radius: 30px; font-weight: bold; font-size: 16px;
            letter-spacing: 0.5px; border: 1px solid rgba(0, 188, 212, 0.3);
            backdrop-filter: blur(4px); box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            pointer-events: auto; width: fit-content;
        }
        .room-badge {
            background: rgba(0, 0, 0, 0.6); color: #fff; padding: 6px 14px;
            border-radius: 20px; font-size: 12px; font-weight: 600;
            border: 1px solid rgba(255, 255, 255, 0.15); width: fit-content;
            text-transform: uppercase; letter-spacing: 1px;
        }
        #loading-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: #111; display: flex; flex-direction: column;
            justify-content: center; align-items: center; z-index: 100;
            transition: opacity 0.5s ease; color: #fff; gap: 15px;
        }
        .spinner {
            width: 40px; height: 40px; border: 4px solid rgba(255,255,255,0.1);
            border-top-color: #00bcd4; border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r105/three.min.js"></script>
    <script>window.process = { env: { NODE_ENV: 'production' } };</script>
    <script src="https://cdn.jsdelivr.net/npm/panolens@0.12.1/build/panolens.min.js"></script>

    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
</head>
<body>

    <div id="loading-overlay">
        <div class="spinner"></div>
        <div id="loading-text" style="font-size: 14px; letter-spacing: 1px; color: #aaa;">Streaming Virtual Assets...</div>
    </div>

    <div id="tour-overlay-ui">
        <div id="ui-project-name" class="project-badge">Loading Tour...</div>
        <div id="ui-room-name" class="room-badge">Locating Coordinates</div>
    </div>

    <div id="viewer-container"></div>

    <script>
        // Exact matching sync configuration credentials
        const firebaseConfig = {
            apiKey: "AIzaSyDh-u_fBujEDL2qJoypFrMyvYzhIeUDuWY",
            authDomain: "virtualtour-54c99.firebaseapp.com",
            projectId: "virtualtour-54c99",
            storageBucket: "virtualtour-54c99.firebasestorage.app",
            messagingSenderId: "52412538071",
            appId: "1:52412538071:web:eb9799ac8ebac146cbe492",
            measurementId: "G-PG5TE98PGB"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        const container = document.querySelector('#viewer-container');
        let projectId = new URLSearchParams(window.location.search).get('id');
        
        let viewer = null;
        let tourPanoramas = {};

        if (!projectId) {
            document.getElementById('loading-text').textContent = "Error: Missing configuration payload ticket.";
            alert("No project selected to preview! Redirecting.");
            window.location.href = 'dashboard.html';
        }

        document.addEventListener('DOMContentLoaded', () => {
            // Instantiate presentation runtime engine layout structures
            viewer = new PANOLENS.Viewer({ 
                container: container, 
                autoHideInfospot: false, // 👈 This locks them into permanent visibility
                controlBar: true,
                cameraFov: 80
            });

            loadTourFromCloud();
        });

        function loadTourFromCloud() {
            db.collection("vrtours").doc(projectId).get().then((doc) => {
                if (!doc.exists) {
                    document.getElementById('loading-text').textContent = "Error: Project not found.";
                    alert("The requested virtual tour database entry does not exist.");
                    return;
                }

                const projectData = doc.data();
                document.getElementById('ui-project-name').textContent = projectData.name || "360° EXPERIENCE";

                const scenes = projectData.scenes || {};
                const sceneKeys = Object.keys(scenes);

                if (sceneKeys.length === 0) {
                    document.getElementById('loading-text').textContent = "No Scenes configured inside this template.";
                    return;
                }

                // Compile and generate all scene instances dynamically out of incoming schemas
                sceneKeys.forEach(key => {
                    const sceneData = scenes[key];
                    const pano = new PANOLENS.ImagePanorama(sceneData.image);

                    // --- NEW CRITICAL FEATURE: Default Camera Target Vector Orientation Alignment Injection ---
                    if (sceneData.initialLook) {
                        pano.addEventListener('enter-fade-start', function() {
                            viewer.tweenControlCenter(
                                new THREE.Vector3(sceneData.initialLook.x, sceneData.initialLook.y, sceneData.initialLook.z), 
                                0 // Snap instantly with zero millisecond delay on entry transitions
                            );
                        });
                    }

                    // Dynamically update UI Badge details upon viewport swaps
                    pano.addEventListener('enter-done', function() {
                        document.getElementById('ui-room-name').textContent = `Current Area: ${key.replace(/_/g, ' ')}`;
                    });

                    tourPanoramas[key] = pano;
                    viewer.add(pano);
                });

                // Run a second configuration pass to link hotspots between compilation layers
                sceneKeys.forEach(key => {
                    const sceneData = scenes[key];
                    const activePano = tourPanoramas[key];
                    const hotspots = sceneData.hotspots || [];

                    hotspots.forEach(h => {
                        // Check if the target room still exists before drawing the arrow link
                        if (tourPanoramas[h.target]) {
                            const arrow = new PANOLENS.Infospot(280, PANOLENS.DataImage.Arrow);
                            arrow.position.set(h.x, h.y, h.z);
                            arrow.addHoverText(`Move to: ${h.target.replace(/_/g, ' ').toUpperCase()}`);
                            
                            // Navigation click transition callback handler
                            arrow.addEventListener('click', function() {
                                viewer.setPanorama(tourPanoramas[h.target]);
                            });

                            activePano.add(arrow);
                        }
                    });
                });

                // Establish baseline environment entry points
                const startingSceneKey = projectData.initialScene || sceneKeys[0];
                
                if (tourPanoramas[startingSceneKey]) {
                    viewer.setPanorama(tourPanoramas[startingSceneKey]);
                }

                // Wipe out loading masks instantly as graphic layers load smoothly
                setTimeout(() => {
                    const loader = document.getElementById('loading-overlay');
                    loader.style.opacity = '0';
                    setTimeout(() => loader.style.display = 'none', 500);
                }, 600);

            }).catch(err => {
                console.error(err);
                document.getElementById('loading-text').textContent = "Cloud connection breakdown exception.";
                alert("Error pulling live environment elements down: " + err);
            });
        }
    </script>
</body>
</html>
