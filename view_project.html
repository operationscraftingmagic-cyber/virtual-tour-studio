<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>360° Virtual Tour Viewer</title>

  <!-- Node.js 'process' Polyfill for Browser Compatibility -->
  <script>
    window.process = { env: { NODE_ENV: 'production' } };
  </script>

  <!-- Core Libraries -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r105/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/panolens@0.12.1/build/panolens.min.js"></script>

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #000;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: #fff;
    }
    #viewer-container {
      width: 100vw;
      height: 100vh;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 1;
    }
    #viewer-container canvas {
      width: 100% !important;
      height: 100% !important;
      outline: none;
    }

    /* Floating Navigation Controls - Translucent Design */
    .overlay-ui {
      position: absolute;
      top: 20px;
      left: 20px;
      z-index: 10;
      display: flex;
      align-items: center;
      gap: 10px;
      background: rgba(0, 0, 0, 0.35);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      padding: 8px 14px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
    }
    .overlay-ui label {
      font-size: 0.85rem;
      color: rgba(255, 255, 255, 0.85);
      font-weight: 500;
    }
    .overlay-ui select {
      background-color: rgba(20, 20, 20, 0.4);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #00e676;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 0.88rem;
      font-weight: 600;
      cursor: pointer;
      outline: none;
      transition: background-color 0.2s, border-color 0.2s;
    }
    .overlay-ui select:hover {
      background-color: rgba(30, 30, 30, 0.6);
      border-color: #00e676;
    }

    .top-right-actions {
      position: absolute;
      top: 20px;
      right: 20px;
      z-index: 10;
      display: flex;
      gap: 10px;
    }
    .action-btn {
      background: rgba(0, 0, 0, 0.35);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: rgba(255, 255, 255, 0.9);
      padding: 8px 14px;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
    }
    .action-btn:hover {
      background: rgba(0, 0, 0, 0.6);
      border-color: #00e676;
      color: #fff;
    }

    /* Loading Screen Overlay */
    #loading-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: #0d0d0d;
      color: #00e676;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 100;
      transition: opacity 0.4s ease;
    }
    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid rgba(0, 230, 118, 0.2);
      border-top-color: #00e676;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-bottom: 16px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>

  <!-- Loading State -->
  <div id="loading-overlay">
    <div class="spinner"></div>
    <span id="loading-text">Connecting to Virtual Tour...</span>
  </div>

  <!-- Top Navigation UI -->
  <div class="overlay-ui">
    <label for="room-selector">Current Location:</label>
    <select id="room-selector"></select>
  </div>

  <div class="top-right-actions">
    <button class="action-btn" id="fullscreen-btn">Fullscreen</button>
  </div>

  <!-- Panolens Viewer Container -->
  <div id="viewer-container"></div>

  <script>
    // =========================================================================
    // FIREBASE INITIALIZATION & CONFIGURATION
    // =========================================================================
    const firebaseConfig = {
      apiKey: "AIzaSyDh-u_fBujEDL2qJoypFrMyvYzhIeUDuWY",
      authDomain: "virtualtour-54c99.firebaseapp.com",
      projectId: "virtualtour-54c99",
      storageBucket: "virtualtour-54c99.firebasestorage.app",
      messagingSenderId: "52412538071",
      appId: "1:52412538071:web:eb9799ac8ebac146cbe492"
    };

    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }
    const db = firebase.firestore();

    // Force Long-Polling to bypass WebSocket/gRPC 10s backend connection timeouts
    db.settings({ 
      experimentalForceLongPolling: true 
    });

    const urlParams = new URLSearchParams(window.location.search);
    const projectId = urlParams.get('project') || 'demo_tour';

    let activeProjectData = {
      initialScene: "",
      scenes: {}
    };

    let viewer = null;
    let activeSceneKey = "";
    const panoCache = {};

    // =========================================================================
    // INITIALIZATION
    // =========================================================================
    window.addEventListener('DOMContentLoaded', async () => {
      const container = document.getElementById('viewer-container');

      viewer = new PANOLENS.Viewer({
        container: container,
        autoHideInfospot: false,
        controlBar: true,
        output: 'console'
      });

      window.addEventListener('resize', () => {
        if (viewer) viewer.onWindowResize();
      });

      // UI Control Bindings
      document.getElementById('room-selector').addEventListener('change', (e) => switchActiveRoom(e.target.value));
      document.getElementById('fullscreen-btn').addEventListener('click', toggleFullscreen);

      await loadProjectFromCloud();
    });

    // =========================================================================
    // HELPER: PRELOAD PANORAMA IMAGE
    // =========================================================================
    function preloadImage(url) {
      return new Promise((resolve, reject) => {
        const img = new Image();
        img.crossOrigin = "anonymous";
        img.onload = () => resolve(img);
        img.onerror = () => reject(new Error("Image failed to load or cross-origin policy blocked access."));
        img.src = url;
      });
    }

    function showLoadingOverlay(msg) {
      const el = document.getElementById('loading-overlay');
      document.getElementById('loading-text').innerText = msg || "Loading...";
      el.style.display = 'flex';
      el.style.opacity = '1';
    }

    function hideLoadingOverlay() {
      const el = document.getElementById('loading-overlay');
      el.style.opacity = '0';
      setTimeout(() => { el.style.display = 'none'; }, 400);
    }

    function toggleFullscreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(err => alert(`Fullscreen error: ${err.message}`));
      } else {
        if (document.exitFullscreen) document.exitFullscreen();
      }
    }

    // =========================================================================
    // FIRESTORE DATA LOADER WITH OFFLINE FALLBACK
    // =========================================================================
    async function loadProjectFromCloud() {
      try {
        showLoadingOverlay("Fetching tour package...");
        const docRef = db.collection('projects').doc(projectId);

        let docSnap;
        try {
          docSnap = await docRef.get();
        } catch (netErr) {
          console.warn("Live network request failed. Attempting offline cache...", netErr);
          try {
            docSnap = await docRef.get({ source: 'cache' });
          } catch (cacheErr) {
            throw new Error("Could not reach Firestore backend and no offline cache exists.");
          }
        }

        if (docSnap && docSnap.exists) {
          activeProjectData = docSnap.data();
          populateRoomSelector();

          if (activeProjectData.initialScene && activeProjectData.scenes[activeProjectData.initialScene]) {
            await switchActiveRoom(activeProjectData.initialScene);
          } else if (Object.keys(activeProjectData.scenes).length > 0) {
            await switchActiveRoom(Object.keys(activeProjectData.scenes)[0]);
          } else {
            hideLoadingOverlay();
            alert("This virtual tour does not contain any room scenes yet.");
          }
        } else {
          hideLoadingOverlay();
          alert(`No virtual tour found matching ID "${projectId}".`);
        }
      } catch (err) {
        console.error("Firestore fetch error:", err);
        hideLoadingOverlay();
        alert("Database Connection Warning:\n\n" + err.message);
      }
    }

    function populateRoomSelector() {
      const selector = document.getElementById('room-selector');
      selector.innerHTML = '';

      const keys = Object.keys(activeProjectData.scenes);
      keys.forEach(key => {
        const option = document.createElement('option');
        option.value = key;
        const displayTitle = activeProjectData.scenes[key].title || key.replace(/_/g, ' ').toUpperCase();
        option.textContent = displayTitle;
        selector.appendChild(option);
      });
    }

    // =========================================================================
    // PANORAMA SWITCHING & HOTSPOT RENDERING
    // =========================================================================
    async function switchActiveRoom(roomKey) {
      if (!activeProjectData.scenes[roomKey]) return;

      activeSceneKey = roomKey;
      document.getElementById('room-selector').value = roomKey;

      const sceneData = activeProjectData.scenes[roomKey];
      const roomTitle = sceneData.title || roomKey.replace(/_/g, ' ');
      showLoadingOverlay(`Entering ${roomTitle}...`);

      try {
        if (!panoCache[roomKey]) {
          const loadedImg = await preloadImage(sceneData.image);
          const newPano = new PANOLENS.ImagePanorama(loadedImg.src);

          // Build portals/hotspots for this room
          if (sceneData.hotspots && Array.isArray(sceneData.hotspots)) {
            sceneData.hotspots.forEach(spot => {
              const infospot = new PANOLENS.Infospot(350, PANOLENS.DataImage.Arrow);
              
              const posX = spot.x !== undefined ? spot.x : spot.pitch;
              const posY = spot.y !== undefined ? spot.y : spot.yaw;
              const posZ = spot.z !== undefined ? spot.z : spot.distance;

              infospot.position.set(posX, posY, posZ);

              const targetRoom = activeProjectData.scenes[spot.targetScene];
              const targetTitle = targetRoom ? (targetRoom.title || spot.targetScene.replace(/_/g, ' ')) : spot.targetScene;
              const hoverMsg = spot.label || `Go to: ${targetTitle}`;
              
              infospot.addHoverText(hoverMsg);

              infospot.addEventListener('click', () => {
                switchActiveRoom(spot.targetScene);
              });

              newPano.add(infospot);
            });
          }

          newPano.addEventListener('load', () => {
            hideLoadingOverlay();
            if (viewer) viewer.onWindowResize();
          });

          panoCache[roomKey] = newPano;
          viewer.add(newPano);
        }

        viewer.setPanorama(panoCache[roomKey]);

        // Restore initial camera orientation if saved
        if (sceneData.initialLook && !isNaN(sceneData.initialLook.x)) {
          const look = sceneData.initialLook;
          const targetVector = new THREE.Vector3(look.x, look.y, look.z);
          setTimeout(() => {
            if (viewer && typeof viewer.tweenControlCenter === 'function') {
              viewer.tweenControlCenter(targetVector, 0);
            }
          }, 350);
        }

        setTimeout(() => {
          if (viewer) viewer.onWindowResize();
          hideLoadingOverlay();
        }, 300);

      } catch (err) {
        hideLoadingOverlay();
        console.error("Panorama loading error:", err);
        alert("Unable to render room image: " + err.message);
      }
    }
  </script>
</body>
</html>
