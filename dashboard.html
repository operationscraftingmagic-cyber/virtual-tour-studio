<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Virtual Tour Studio - Dashboard</title>

  <!-- Firebase SDKs (Free Firestore Database) -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #121212;
      color: #e0e0e0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      background-color: #1e1e1e;
      padding: 16px 30px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #333;
    }
    header h1 {
      font-size: 1.3rem;
      color: #00e676;
    }
    .container {
      max-width: 1200px;
      margin: 30px auto;
      padding: 0 20px;
      width: 100%;
    }
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 25px;
    }
    .top-bar h2 {
      font-size: 1.5rem;
      font-weight: 500;
    }
    button {
      background-color: #2979ff;
      color: white;
      border: none;
      padding: 10px 18px;
      border-radius: 6px;
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover {
      background-color: #1565c0;
    }
    button.secondary {
      background-color: #333;
      color: #ccc;
    }
    button.secondary:hover {
      background-color: #444;
    }
    button.danger {
      background-color: #d32f2f;
    }
    button.danger:hover {
      background-color: #9a0007;
    }
    .project-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 20px;
    }
    .project-card {
      background-color: #1e1e1e;
      border: 1px solid #2e2e2e;
      border-radius: 10px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: transform 0.2s, border-color 0.2s;
    }
    .project-card:hover {
      transform: translateY(-3px);
      border-color: #444;
    }
    .card-header {
      margin-bottom: 15px;
    }
    .card-title {
      font-size: 1.1rem;
      font-weight: 600;
      color: #fff;
      word-break: break-all;
      margin-bottom: 6px;
    }
    .card-subtitle {
      font-size: 0.85rem;
      color: #888;
    }
    .card-stats {
      font-size: 0.85rem;
      color: #aaa;
      margin-bottom: 20px;
      background-color: #121212;
      padding: 8px 12px;
      border-radius: 6px;
      display: inline-block;
    }
    .card-actions {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .card-actions-row {
      display: flex;
      gap: 8px;
    }
    .card-actions-row button {
      flex: 1;
    }
    .empty-state {
      text-align: center;
      padding: 60px 20px;
      background-color: #1a1a1a;
      border-radius: 10px;
      border: 1px dashed #333;
      grid-column: 1 / -1;
    }
    .empty-state h3 {
      font-size: 1.2rem;
      color: #aaa;
      margin-bottom: 10px;
    }

    /* Modal Styling */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.75);
      justify-content: center;
      align-items: center;
      z-index: 100;
    }
    .modal {
      background: #1e1e1e;
      padding: 25px;
      border-radius: 10px;
      width: 100%;
      max-width: 420px;
      border: 1px solid #333;
    }
    .modal h3 {
      margin-bottom: 15px;
      font-size: 1.2rem;
    }
    .input-group {
      margin-bottom: 18px;
    }
    label {
      display: block;
      font-size: 0.85rem;
      color: #aaa;
      margin-bottom: 6px;
    }
    input[type="text"] {
      width: 100%;
      padding: 10px;
      background: #121212;
      border: 1px solid #3a3a3a;
      border-radius: 6px;
      color: #fff;
      font-size: 0.95rem;
    }
    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
    }
  </style>
</head>
<body>

  <header>
    <h1>Virtual Tour Studio</h1>
    <span style="font-size:0.85rem; color:#888;">Project Hub</span>
  </header>

  <div class="container">
    <div class="top-bar">
      <h2>All Virtual Tour Projects</h2>
      <button onclick="openCreateModal()">+ Create New Project</button>
    </div>

    <!-- Dynamic Projects List Grid -->
    <div id="project-grid" class="project-grid">
      <div class="empty-state">Loading your projects...</div>
    </div>
  </div>

  <!-- Create New Project Modal -->
  <div id="create-modal" class="modal-overlay">
    <div class="modal">
      <h3>Create New Virtual Tour</h3>
      <div class="input-group">
        <label for="new-project-name">Project Title or ID:</label>
        <input type="text" id="new-project-name" placeholder="e.g. Modern Villa Tour">
      </div>
      <div class="modal-actions">
        <button class="secondary" onclick="closeCreateModal()">Cancel</button>
        <button id="create-project-btn" onclick="handleCreateProject()">Create & Open Editor</button>
      </div>
    </div>
  </div>

  <script>
    // =========================================================================
    // FIREBASE CONFIGURATION (Paste your actual Firebase keys here)
    // =========================================================================
    const firebaseConfig = {
      apiKey: "YOUR_FIREBASE_API_KEY",
      authDomain: "YOUR_PROJECT.firebaseapp.com",
      projectId: "YOUR_PROJECT_ID",
      storageBucket: "YOUR_PROJECT.appspot.com",
      messagingSenderId: "123456789",
      appId: "YOUR_APP_ID"
    };

    // Helper to check for missing API keys
    function isFirebaseConfigured() {
      return firebaseConfig.apiKey !== "YOUR_FIREBASE_API_KEY" && 
             firebaseConfig.projectId !== "YOUR_PROJECT_ID";
    }

    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }
    const db = firebase.firestore();

    // =========================================================================
    // FETCH & RENDER ALL PROJECTS
    // =========================================================================
    async function loadAllProjects() {
      const grid = document.getElementById('project-grid');

      if (!isFirebaseConfigured()) {
        grid.innerHTML = `
          <div class="empty-state" style="border-color: #ffb74d;">
            <h3 style="color: #ffb74d;">Firebase Credentials Required</h3>
            <p style="color:#aaa; font-size:0.9rem; margin-top:8px;">
              Please open <code>dashboard.html</code> in a code editor and replace <strong>YOUR_FIREBASE_API_KEY</strong> and <strong>YOUR_PROJECT_ID</strong> with your real Firebase config values.
            </p>
          </div>
        `;
        return;
      }

      try {
        const snapshot = await db.collection('projects').get();

        if (snapshot.empty) {
          grid.innerHTML = `
            <div class="empty-state">
              <h3>No virtual tours found</h3>
              <p style="color:#666; font-size:0.9rem; margin-bottom:15px;">Get started by creating your first 360° tour project.</p>
              <button onclick="openCreateModal()">+ Create New Project</button>
            </div>
          `;
          return;
        }

        grid.innerHTML = ''; // Clear loading state

        snapshot.forEach((doc) => {
          const projectData = doc.data();
          const projectId = doc.id;
          const scenesCount = projectData.scenes ? Object.keys(projectData.scenes).length : 0;
          const startRoom = projectData.initialScene || "Not set";

          const card = document.createElement('div');
          card.className = 'project-card';
          card.innerHTML = `
            <div>
              <div class="card-header">
                <div class="card-title">${projectId}</div>
                <div class="card-subtitle">Start Room: <strong>${startRoom}</strong></div>
              </div>
              <div class="card-stats">
                📷 Total Rooms: <strong>${scenesCount}</strong>
              </div>
            </div>

            <div class="card-actions">
              <button onclick="window.location.href='editor.html?project=${projectId}'">
                ✏️ Edit Tour
              </button>
              <div class="card-actions-row">
                <button class="secondary" onclick="window.location.href='view_project.html?project=${projectId}'">
                  👁️ Preview
                </button>
                <button class="secondary" onclick="copyShareLink('${projectId}')">
                  🔗 Copy Link
                </button>
                <button class="danger" onclick="deleteProject('${projectId}')">
                  🗑️
                </button>
              </div>
            </div>
          `;
          grid.appendChild(card);
        });

      } catch (error) {
        console.error("Error loading projects:", error);
        grid.innerHTML = `
          <div class="empty-state" style="color:#ff5252; border-color: #ff5252;">
            <h3>Connection Error</h3>
            <p style="margin-top:8px; font-size:0.9rem;">${error.message}</p>
            <p style="margin-top:10px; font-size:0.8rem; color:#aaa;">
              Ensure your browser isn't blocking <code>firestore.googleapis.com</code> (disable ad-blockers or Brave Shields if active).
            </p>
          </div>
        `;
      }
    }

    // =========================================================================
    // CREATE NEW PROJECT
    // =========================================================================
    function openCreateModal() {
      if (!isFirebaseConfigured()) {
        alert("Please set your Firebase credentials inside dashboard.html before creating a project.");
        return;
      }
      document.getElementById('create-modal').style.display = 'flex';
      document.getElementById('new-project-name').focus();
    }

    function closeCreateModal() {
      document.getElementById('create-modal').style.display = 'none';
      document.getElementById('new-project-name').value = '';
    }

    async function handleCreateProject() {
      const input = document.getElementById('new-project-name');
      const createBtn = document.getElementById('create-project-btn');
      const rawName = input.value.trim();

      if (!rawName) {
        alert("Please enter a project title or ID.");
        return;
      }

      // Convert spaces and special characters to clean ID string
      const cleanProjectId = rawName.toLowerCase().replace(/[^a-z0-9_-]/g, '_');

      createBtn.disabled = true;
      createBtn.innerText = "Creating...";

      try {
        const docRef = db.collection('projects').doc(cleanProjectId);

        // Safe merge write prevents offline blocking errors
        await docRef.set({
          initialScene: "",
          scenes: {}
        }, { merge: true });

        // Redirect directly to editor
        window.location.href = `editor.html?project=${cleanProjectId}`;

      } catch (error) {
        console.error("Error creating project:", error);
        alert("Failed to create project: " + error.message);
      } finally {
        createBtn.disabled = false;
        createBtn.innerText = "Create & Open Editor";
      }
    }

    // =========================================================================
    // SHARE & DELETE ACTIONS
    // =========================================================================
    function copyShareLink(projectId) {
      const baseUrl = window.location.href.substring(0, window.location.href.lastIndexOf('/'));
      const shareUrl = `${baseUrl}/view_project.html?project=${projectId}`;
      
      navigator.clipboard.writeText(shareUrl).then(() => {
        alert("Client view link copied to clipboard!\n\n" + shareUrl);
      }).catch(() => {
        prompt("Copy this client link:", shareUrl);
      });
    }

    async function deleteProject(projectId) {
      if (!confirm(`Are you sure you want to permanently delete project "${projectId}"? This cannot be undone.`)) {
        return;
      }

      try {
        await db.collection('projects').doc(projectId).delete();
        loadAllProjects(); // Refresh grid
      } catch (error) {
        console.error("Error deleting project:", error);
        alert("Failed to delete project: " + error.message);
      }
    }

    // Load projects on startup
    window.addEventListener('DOMContentLoaded', loadAllProjects);
  </script>
</body>
</html>
