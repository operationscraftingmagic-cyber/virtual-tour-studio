<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panolens 360 Viewer - Hotspot & Camera Fix</title>

  <!-- Three.js and Panolens CDNs -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r105/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/panolens@0.12.1/build/panolens.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #111827;
      color: #ffffff;
      overflow: hidden;
    }

    #container {
      width: 100vw;
      height: 100vh;
      position: absolute;
      top: 0;
      left: 0;
    }

    #ui-panel {
      position: absolute;
      top: 20px;
      left: 20px;
      z-index: 10;
      background: rgba(17, 24, 39, 0.85);
      backdrop-filter: blur(10px);
      padding: 18px 22px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
      display: flex;
      flex-direction: column;
      gap: 12px;
      width: 320px;
    }

    h3 {
      font-size: 16px;
      font-weight: 600;
      color: #f9fafb;
    }

    .coords-display {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 13px;
      background: rgba(0, 0, 0, 0.3);
      padding: 10px 12px;
      border-radius: 6px;
      color: #38bdf8;
      border: 1px solid rgba(56, 189, 248, 0.2);
    }

    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    button {
      background-color: #2563eb;
      color: #ffffff;
      border: none;
      padding: 10px 14px;
      font-size: 13px;
      font-weight: 500;
      border-radius: 6px;
      cursor: pointer;
      transition: background-color 0.2s ease, opacity 0.2s ease;
    }

    button:hover:not(:disabled) {
      background-color: #1d4ed8;
    }

    button:disabled {
      background-color: #374151;
      color: #9ca3af;
      cursor: not-allowed;
      opacity: 0.6;
    }
  </style>
</head>
<body>

  <div id="container"></div>

  <div id="ui-panel">
    <h3>Hotspot & View Control</h3>
    <div id="click-coords" class="coords-display">Click anywhere on the panorama...</div>
    
    <div class="btn-group">
      <button id="add-hotspot-btn" disabled onclick="addHotspotAtClick()">Add Hotspot at Clicked Point</button>
      <button id="capture-viewpoint-btn" onclick="captureDefaultViewpoint()">Save Default View Angle</button>
    </div>
  </div>

  <script>
    let viewer, currentPanoObj;
    let currentClickedVector = null;
    let activeSceneKey = "room1";

    // Project data model
    const activeProjectData = {
      scenes: {
        room1: {
          image: "https://p3d.in/img/demo.jpg", // Replace with your equirectangular image URL or local path
          initialLook: null,
          hotspots: []
        }
      }
    };

    const container = document.getElementById('container');

    function initPanorama() {
      // Initialize Panolens Viewer
      viewer = new PANOLENS.Viewer({
        container: container,
        autoRotate: false,
        controlBar: true
      });

      const scene = activeProjectData.scenes[activeSceneKey];
      currentPanoObj = new PANOLENS.ImagePanorama(scene.image);

      viewer.add(currentPanoObj);

      // Attach the Raycaster click event listener
      setupClickListener();
    }

    function setupClickListener() {
      container.addEventListener('click', (event) => {
        if (!viewer || !currentPanoObj) return;

        const rect = container.getBoundingClientRect();
        const mouse = new THREE.Vector2(
          ((event.clientX - rect.left) / container.clientWidth) * 2 - 1,
          -((event.clientY - rect.top) / container.clientHeight) * 2 + 1
        );

        const raycaster = new THREE.Raycaster();
        raycaster.setFromCamera(mouse, viewer.getCamera());

        const intersects = raycaster.intersectObject(currentPanoObj, true);

        if (intersects.length > 0) {
          const pt = intersects[0].point;

          // 1. Local coordinates for Infospots inside currentPanoObj 
          // (X negated to balance Panolens internal sphere scaling)
          currentClickedVector = new THREE.Vector3(-Math.round(pt.x), Math.round(pt.y), Math.round(pt.z));

          // 2. World coordinates for Camera target (unflipped point)
          const worldPoint = new THREE.Vector3(Math.round(pt.x), Math.round(pt.y), Math.round(pt.z));

          // Rotate camera smoothly to face the clicked point in World space
          if (typeof viewer.tweenControlCenter === 'function') {
            viewer.tweenControlCenter(worldPoint, 1000);
          }

          document.getElementById('click-coords').innerText =
            `X: ${currentClickedVector.x}, Y: ${currentClickedVector.y}, Z: ${currentClickedVector.z}`;

          document.getElementById('add-hotspot-btn').disabled = false;
        }
      });
    }

    function addHotspotAtClick() {
      if (!currentClickedVector) return;

      const infospot = new PANOLENS.Infospot(350, PANOLENS.DataImage.Info);
      infospot.position.copy(currentClickedVector);
      infospot.addHoverText("Hotspot");

      currentPanoObj.add(infospot);

      activeProjectData.scenes[activeSceneKey].hotspots.push({
        x: currentClickedVector.x,
        y: currentClickedVector.y,
        z: currentClickedVector.z
      });

      console.log("Hotspot positioned locally at:", currentClickedVector);
    }

    function captureDefaultViewpoint() {
      if (!activeSceneKey || !activeProjectData.scenes[activeSceneKey]) {
        alert("Please select a room first.");
        return;
      }

      let target = null;

      // Convert local clicked vector back to World Space for camera target calculation
      if (currentClickedVector) {
        target = new THREE.Vector3(-currentClickedVector.x, currentClickedVector.y, currentClickedVector.z);
      } else if (typeof viewer.getRaycastViewCenter === 'function') {
        target = viewer.getRaycastViewCenter();
      } else if (viewer.getCamera && viewer.getCamera()) {
        const camera = viewer.getCamera();
        const dir = new THREE.Vector3();
        camera.getWorldDirection(dir);
        target = new THREE.Vector3(dir.x * 5000, dir.y * 5000, dir.z * 5000);
      }

      if (!target || isNaN(target.x)) {
        alert("Please click anywhere on the 360° photo to choose the view angle first.");
        return;
      }

      const newViewpoint = {
        x: Math.round(target.x),
        y: Math.round(target.y),
        z: Math.round(target.z)
      };

      activeProjectData.scenes[activeSceneKey].initialLook = newViewpoint;

      if (viewer && typeof viewer.tweenControlCenter === 'function') {
        viewer.tweenControlCenter(new THREE.Vector3(newViewpoint.x, newViewpoint.y, newViewpoint.z), 800);
      }

      alert(`Saved default view angle for [${activeSceneKey}]: (${newViewpoint.x}, ${newViewpoint.y}, ${newViewpoint.z})`);
    }

    window.addEventListener('DOMContentLoaded', initPanorama);
  </script>
</body>
</html>
