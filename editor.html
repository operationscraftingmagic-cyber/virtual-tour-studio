<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Virtual Tour Studio</title>

  <!-- Pannellum Viewer CSS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.css"/>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: Arial, sans-serif;
    }

    #panorama {
      width: 100vw;
      height: 100vh;
    }

    /* =================================================== */
    /* CUSTOM HOTSPOT BUTTON STYLING                       */
    /* =================================================== */
    .custom-arrow-hotspot {
      width: 50px;
      height: 50px;
      background-image: url('https://github.com/operationscraftingmagic-cyber/virtual-tour-studio/blob/main/ButtonArrow.png?raw=true');
      background-size: contain;
      background-repeat: no-repeat;
      background-position: center;
      cursor: pointer;
      border: none;
      background-color: transparent;

      /* Centers the icon relative to the anchor coordinates */
      margin-left: -25px;
      margin-top: -25px;

      /* Smooth hover animation */
      transition: transform 0.25s ease-in-out, filter 0.25s ease-in-out;
    }

    .custom-arrow-hotspot:hover {
      transform: scale(1.25);
      filter: drop-shadow(0px 0px 8px rgba(255, 255, 255, 0.8));
    }
  </style>
</head>
<body>

  <!-- Panorama Container -->
  <div id="panorama"></div>

  <!-- Pannellum Viewer JS -->
  <script src="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.js"></script>

  <script>
    pannellum.viewer('panorama', {
      "type": "equirectangular",
      "panorama": "https://pannellum.org/images/alma.jpg", // Replace with your panorama image URL
      "autoLoad": true,
      "hotspots": [
        {
          "pitch": -10,
          "yaw": 0,
          "type": "info",
          "text": "Navigate Forward",
          "cssClass": "custom-arrow-hotspot",
          "clickHandlerFunc": function() {
            alert("Hotspot clicked!"); // Replace with your scene change function
          }
        }
      ]
    });
  </script>

</body>
</html>
