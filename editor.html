<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>360° Virtual Tour Editor Studio</title>

  <!-- Node.js 'process' Polyfill for Browser Compatibility -->
  <script>
    window.process = { env: { NODE_ENV: 'production' } };
  </script>

  <!-- Core 3D Libraries -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r105/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/panolens@0.12.1/build/panolens.min.js"></script>
  
  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

  <style>
    :root {
      --bg-dark: #0f1117;
      --panel-bg: #181b23;
      --card-bg: #212530;
      --border-color: #2e3445;
      --text-main: #f1f5f9;
      --text-muted: #94a3b8;
      --accent-primary: #3b82f6;
      --accent-hover: #2563eb;
      --accent-success: #10b981;
      --accent-success-hover: #059669;
      --accent-danger: #ef4444;
      --accent-danger-hover: #dc2626;
      --badge-bg: #1e293b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background-color: var(--bg-dark);
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    /* HEADER BAR */
    header {
      background-color: var(--panel-bg);
      padding: 12px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border-color);
      z-index: 20;
    }

    header h1 {
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--accent-success);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .header-btns {
      display: flex;
      gap: 12px;
    }

    /* EDITOR LAYOUT */
    #editor-container {
      display: flex;
      flex: 1;
      height: calc(100vh - 57px);
      position: relative;
      width: 100%;
      overflow: hidden;
    }

    #viewer-canvas {
      flex: 1;
      height: 100%;
      width: 100%;
      background-color: #000;
      position: relative;
    }

    #viewer-canvas canvas {
      width: 100% !important;
      height: 100% !important;
      position: absolute;
      top: 0;
      left: 0;
      outline: none;
    }

    #loading-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(15, 17, 23, 0.88);
      backdrop-filter: blur(4px);
      color: var(--accent-success);
      font-size: 1.1rem;
      font-weight: 600;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 12px;
      z-index: 50;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }

    .spinner {
      width: 36px;
      height: 36px;
      border: 3px solid rgba(16, 185, 129, 0.2);
      border-top-color: var(--accent-success);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* CONTROL SIDEBAR */
    #control-panel {
      width: 390px;
      background-color: var(--panel-bg);
      border-left: 1px solid var(--border-color);
      padding: 20px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 18px;
      z-index: 10;
    }

    .panel-section {
      background-color: var(--card-bg);
      padding: 16px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
    }

    .panel-section h3 {
      font-size: 0.82rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      color: var(--text-muted);
      margin-bottom: 12px;
    }

    .input-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 12px;
    }

    label {
      font-size: 0.8rem;
      font-weight: 500;
      color: var(--text-muted);
    }

    input[type="text"], input[type="file"], select {
      background-color: var(--bg-dark);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 9px 12px;
      border-radius: 6px;
      font-size: 0.88rem;
      width: 100%;
      transition: border-color 0.2s;
    }

    input[type="text"]:focus, select:focus {
      outline: none;
      border-color: var(--accent-primary);
    }

    input[type="file"] {
      padding: 6px;
      cursor: pointer;
    }

    button {
      background-color: var(--accent-primary);
      color: #fff;
      border: none;
      padding: 10px 14px;
      border-radius: 6px;
      font-weight: 600;
      font-size: 0.88rem;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
      width: 100%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    button:hover {
      background-color: var(--accent-hover);
    }

    button:active {
      transform: scale(0.98);
    }

    button.secondary {
      background-color: #2b3040;
      color: #cbd5e1;
    }

    button.secondary:hover {
      background-color: #384055;
    }

    button.danger {
      background-color: var(--accent-danger);
    }

    button.danger:hover {
      background-color: var(--accent-danger-hover);
    }

    button.success {
      background-color: var(--accent-success);
    }

    button.success:hover {
      background-color: var(--accent-success-hover);
    }

    button:disabled {
      background-color: #2e3445;
      color: #64748b;
      cursor: not-allowed;
      opacity: 0.7;
    }

    .hotspot-list {
      list-style: none;
      margin-top: 8px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .hotspot-item {
      background-color: var(--bg-dark);
      padding: 10px 12px;
      border-radius: 6px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.85rem;
      border: 1px solid var(--border-color);
    }

    .hotspot-item button {
      width: auto;
      padding: 4px 10px;
      font-size: 0.75rem;
    }

    .coord-badge {
      font-family: "SF Mono", "Roboto Mono", Consolas, monospace;
      font-size: 0.78rem;
      color: #f59e0b;
      background: rgba(245, 158, 11, 0.12);
      padding: 6px 10px;
      border-radius: 4px;
      display: inline-block;
      margin-bottom: 10px;
      border: 1px solid rgba(245, 158, 11, 0.25);
    }

    .row {
      display: flex;
      gap: 8px;
    }

    /* TOAST NOTIFICATION STYLING */
    #toast-container {
      position: fixed;
      bottom: 20px;
      left: 20px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      z-index: 100;
      pointer-events: none;
    }

    .toast {
      background-color: var(--card-bg);
      color: var(--text-main);
      border: 1px solid var(--border-color);
      border-left: 4px solid var(--accent-primary);
      padding: 12px 18px;
      border-radius: 6px;
      font-size: 0.88rem;
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.5);
      animation: slideIn 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      pointer-events: auto;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .toast.success { border-left-color: var(--accent-success); }
    .toast.error { border-left-color: var(--accent-danger); }

    @keyframes slideIn {
      from { transform: translateX(-100%); opacity: 0; }
      to { transform: translateX(0); opacity: 1; }
    }

    @media (max-width: 850px) {
      #editor-container {
        flex-direction: column;
      }
      #control-panel {
        width: 100%;
        height: 45vh;
        border-left: none;
        border-top: 1px solid var(--border-color);
      }
    }
  </style>
</head>
<body>

  <header>
    <h1>🌐 Virtual Tour Studio</h1>
    <div class="header-btns">
      <button class="secondary" id="back-dashboard-btn" style="width:auto;">Dashboard</button>
      <button class="secondary" id="live-presentation-btn" style="width:auto;">Preview Tour</button>
      <button class="success" id="cloud-save-btn" style="width:auto;">Save All Changes</button>
    </div>
  </header>

  <div id="editor-container">
    <!-- 360 Viewport -->
    <div id="viewer-canvas">
      <div id="loading-overlay" style="display:none;">
        <div class="spinner"></div>
        <span id="loading-text">Loading 360° Scene...</span>
      </div>
    </div>

    <!-- Controls Panel -->
    <div id="control-panel">

      <!-- SECTION 1: ADD ROOM -->
      <div class="panel-section">
        <h3>1. Add New Room Scene</h3>
        <div class="input-group">
          <label for="scene-id-input">Room ID (e.g. living_room):</label>
          <input type="text" id="scene-id-input" placeholder="living_room">
        </div>
        <div class="input-group">
          <label for="scene-name-input">Display Title (e.g. Main Living Room):</label>
          <input type="text" id="scene-name-input" placeholder="Main Living Room">
        </div>
        <div class="input-group">
          <label for="scene-file-input">360° Panorama Image File:</label>
          <input type="file" id="scene-file-input" accept="image/jpeg, image/png">
        </div>
        <button id="add-scene-btn" onclick="uploadAndAddScene()">Upload & Add Room</button>
      </div>

      <!-- SECTION 2: ROOM CONTROL -->
      <div class="panel-section">
        <h3>2. Active Room Settings</h3>
        <div class="input-group">
          <label for="scene-selector">Select Active Editing Room:</label>
          <select id="scene-selector"></select>
        </div>
        
        <div class="row" style="margin-bottom: 8px;">
          <button class="secondary" id="set-start-scene-btn">Set as Start Room</button>
          <button class="secondary" id="set-default-view-btn">Save View Angle</button>
        </div>

        <div class="row">
          <button class="danger" id="delete-scene-btn">Delete Active Room</button>
        </div>
      </div>

      <!-- SECTION 3: CREATE HOTSPOT PORTAL -->
      <div class="panel-section">
        <h3>3. Place Portal Hotspot</h3>
        <p style="font-size:0.8rem; color:var(--text-muted); margin-bottom:10px;">
          Click anywhere on the 360° photo to set portal placement coordinate.
        </p>
        <div>Selected Target: <span id="click-coords" class="coord-badge">Click photo to select</span></div>
        
        <div class="input-group">
          <label for="target-scene-selector">Target Destination Room:</label>
          <select id="target-scene-selector"></select>
        </div>

        <div class="input-group">
          <label for="hotspot-label-input">Portal Label Text (Optional):</label>
          <input type="text" id="hotspot-label-input" placeholder="e.g. Walk into Dining Room">
        </div>
        
        <button id="add-hotspot-btn" disabled>Add Navigation Portal</button>
      </div>

      <!-- SECTION 4: EXISTING PORTALS -->
      <div class="panel-section">
        <h3>4. Portals in this Room</h3>
        <ul id="hotspots-list" class="hotspot-list"></ul>
      </div>

    </div>
  </div>

  <div id="toast-container"></div>

  <script>
    // =========================================================================
    // CONFIGURATION & INITIALIZATION
    // =========================================================================
    const CLOUDINARY_CLOUD_NAME = "dxfuktuw";
    const CLOUDINARY_UPLOAD_PRESET = "virtualtour";

    const firebaseConfig = {
      apiKey: "AIzaSyDh-u_fBujEDL2qJoypFrMyvYzhIeUDuWY",
      authDomain: "virtualtour-54c99.firebaseapp.com",
      projectId: "virtualtour-54c99",
      storageBucket: "virtualtour-54c99.firebasestorage.app",
      messagingSenderId: "52412538071",
      appId: "1:52412538071:web:eb9799ac8ebac146cbe492"
    };

    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }
    const db = firebase.firestore();
    db.settings({ experimentalForceLongPolling: true });

    const urlParams = new URLSearchParams(window.location.search);
    const projectId = urlParams.get('project') || 'demo_tour';

    let activeProjectData = {
      initialScene: "",
      scenes: {}
    };

    let activeSceneKey = "";
    let viewer = null;
    let currentPanoObj = null;
    let currentClickedVector = null;
    const panoCache = {};

    // Helper: Toast Notifications
    function showToast(message, type = 'info') {
      const container = document.getElementById('toast-container');
      const toast = document.createElement('div');
      toast.className = `toast ${type}`;
      toast.innerHTML = `<span>${message}</span>`;
      container.appendChild(toast);
      setTimeout(() => {
        toast.style.opacity = '0';
        toast.style.transition = 'opacity 0.3s ease';
        setTimeout(() => toast.remove(), 300);
      }, 3500);
    }

    // Helper: Overlay Loader
    function showLoadingOverlay(msg) {
      const el = document.getElementById('loading-overlay');
      document.getElementById('loading-text').innerText = msg || "Loading...";
      el.style.display = 'flex';
      el.style.opacity = '1';
    }

    function hideLoadingOverlay() {
      const el = document.getElementById('loading-overlay');
      el.style.opacity = '0';
      setTimeout(() => { el.style.display = 'none'; }, 300);
    }

    function preloadImage(url) {
      return new Promise((resolve, reject) => {
        const img = new Image();
        img.crossOrigin = "anonymous";
        img.onload = () => resolve(img);
        img.onerror = () => reject(new Error("Image failed to load due to cross-origin or network error."));
        img.src = url;
      });
    }

    // =========================================================================
    // DOM READY & EVENT SETUP
    // =========================================================================
    window.addEventListener('DOMContentLoaded', async () => {
      const container = document.getElementById('viewer-canvas');

      viewer = new PANOLENS.Viewer({
        container: container,
        autoHideInfospot: false,
        controlBar: true
      });

      window.addEventListener('resize', () => {
        if (viewer) viewer.onWindowResize();
      });

      // Capture Clicked 3D Point on Sphere
      container.addEventListener('click', (event) => {
        if (!viewer || !currentPanoObj) return;

        const rect = container.getBoundingClientRect();
        const mouse = new THREE.Vector2(
          ((event.clientX - rect.left) / container.clientWidth) * 2 - 1,
          -((event.clientY - rect.top) / container.clientHeight) * 2 + 1
        );

        const raycaster = new THREE.Raycaster();
        raycaster.setFromCamera(mouse, viewer.getCamera());
        
        const intersects = raycaster.intersectObject(currentPanoObj, true);

        if (intersects.length > 0) {
          const pt = intersects[0].point;
          // Store exact 3D Cartesian coordinates for accurate Panolens placement
          currentClickedVector = new THREE.Vector3(
            Math.round(pt.x),
            Math.round(pt.y),
            Math.round(pt.z)
          );
          
          if (typeof viewer.tweenControlCenter === 'function') {
            viewer.tweenControlCenter(currentClickedVector, 800);
          }

          document.getElementById('click-coords').innerText = 
            `X: ${currentClickedVector.x}, Y: ${currentClickedVector.y}, Z: ${currentClickedVector.z}`;
          
          document.getElementById('add-hotspot-btn').disabled = false;
        }
      });

      // UI Button Handlers
      document.getElementById('scene-selector').addEventListener('change', (e) => switchActiveRoom(e.target.value));
      document.getElementById('set-start-scene-btn').addEventListener('click', setStartRoom);
      document.getElementById('set-default-view-btn').addEventListener('click', captureDefaultViewpoint);
      document.getElementById('add-hotspot-btn').addEventListener('click', addHotspotToRoom);
      document.getElementById('delete-scene-btn').addEventListener('click', deleteActiveRoom);
      document.getElementById('cloud-save-btn').addEventListener('click', saveProjectToCloud);
      document.getElementById('back-dashboard-btn').addEventListener('click', () => window.location.href = 'dashboard.html');
      document.getElementById('live-presentation-btn').addEventListener('click', () => window.location.href = `view_project.html?project=${projectId}`);

      await loadProjectFromCloud();
    });

    // =========================================================================
    // CLOUDINARY UPLOAD HANDLER
    // =========================================================================
    async function uploadAndAddScene() {
      const fileInput = document.getElementById('scene-file-input');
      const rawIdInput = document.getElementById('scene-id-input');
      const nameInput = document.getElementById('scene-name-input');
      const addBtn = document.getElementById('add-scene-btn');

      const rawId = rawIdInput.value.trim();
      const titleName = nameInput.value.trim() || rawId;
      let file = fileInput.files[0];

      if (!rawId || !file) {
        showToast("Provide both a Room ID and select a 360° image file.", "error");
        return;
      }

      const cleanId = rawId.toLowerCase().replace(/[^a-z0-9]/g, '_');
      
      addBtn.disabled = true;
      addBtn.innerText = "Uploading to Cloud...";

      try {
        const formData = new FormData();
        formData.append('file', file);
        formData.append('upload_preset', CLOUDINARY_UPLOAD_PRESET);

        const res = await fetch(`https://api.cloudinary.com/v1_1/${CLOUDINARY_CLOUD_NAME}/image/upload`, {
          method: 'POST',
          body: formData
        });

        const data = await res.json();
        if (!res.ok) throw new Error(data.error?.message || "Upload failed");

        activeProjectData.scenes[cleanId] = {
          title: titleName,
          image: data.secure_url,
          hotspots: []
        };

        if (!activeProjectData.initialScene) {
          activeProjectData.initialScene = cleanId;
        }

        rebuildInterfaceDropdowns();
        switchActiveRoom(cleanId);

        rawIdInput.value = '';
        nameInput.value = '';
        fileInput.value = '';
        showToast(`Room [${cleanId}] added successfully!`, "success");

      } catch (error) {
        console.error("Cloudinary upload error:", error);
        showToast("Upload failed: " + error.message, "error");
      } finally {
        addBtn.disabled = false;
        addBtn.innerText = "Upload & Add Room";
      }
    }

    // =========================================================================
    // ROOM & PANORAMA MANAGEMENT
    // =========================================================================
    function switchActiveRoom(roomKey) {
      if (!activeProjectData.scenes[roomKey]) return;
      activeSceneKey = roomKey;
      document.getElementById('scene-selector').value = roomKey;
      renderActivePano();
    }

    async function renderActivePano() {
      const sceneData = activeProjectData.scenes[activeSceneKey];
      if (!sceneData || !sceneData.image) return;

      showLoadingOverlay("Preloading 360° View...");

      try {
        if (!panoCache[activeSceneKey]) {
          const loadedImg = await preloadImage(sceneData.image);
          const newPano = new PANOLENS.ImagePanorama(loadedImg.src);

          newPano.addEventListener('load', () => {
            hideLoadingOverlay();
            if (viewer) viewer.onWindowResize();
          });

          panoCache[activeSceneKey] = newPano;
          viewer.add(newPano);
        }

        currentPanoObj = panoCache[activeSceneKey];
        viewer.setPanorama(currentPanoObj);

        setTimeout(() => {
          if (viewer) viewer.onWindowResize();
          hideLoadingOverlay();
        }, 300);

        drawHotspotsToWorkspace();
        renderHotspotsManagementList();

        if (sceneData.initialLook && !isNaN(sceneData.initialLook.x)) {
          const look = sceneData.initialLook;
          const targetVector = new THREE.Vector3(look.x, look.y, look.z);
          setTimeout(() => {
            if (viewer && typeof viewer.tweenControlCenter === 'function') {
              viewer.tweenControlCenter(targetVector, 0);
            }
          }, 350);
        }

      } catch (err) {
        hideLoadingOverlay();
        console.error("Panorama rendering error:", err);
        showToast("Could not render image: " + err.message, "error");
      }

      currentClickedVector = null;
      document.getElementById('click-coords').innerText = "Click photo to select";
      document.getElementById('add-hotspot-btn').disabled = true;
    }

    function setStartRoom() {
      if (!activeSceneKey) return;
      activeProjectData.initialScene = activeSceneKey;
      rebuildInterfaceDropdowns();
      showToast(`Room [${activeSceneKey}] set as initial starting scene.`, "success");
    }

    function captureDefaultViewpoint() {
      if (!activeSceneKey || !activeProjectData.scenes[activeSceneKey]) {
        showToast("Please select a room first.", "error");
        return;
      }

      let target = currentClickedVector;

      if (!target || isNaN(target.x)) {
        if (typeof viewer.getRaycastViewCenter === 'function') {
          target = viewer.getRaycastViewCenter();
        }
      }

      if (!target || isNaN(target.x)) {
        if (viewer.getCamera && viewer.getCamera()) {
          const camera = viewer.getCamera();
          const dir = new THREE.Vector3();
          camera.getWorldDirection(dir);
          target = new THREE.Vector3(dir.x * 5000, dir.y * 5000, dir.z * 5000);
        }
      }

      if (!target || isNaN(target.x)) {
        showToast("Click anywhere on the photo to choose view angle first.", "error");
        return;
      }

      const newViewpoint = {
        x: Math.round(target.x),
        y: Math.round(target.y),
        z: Math.round(target.z)
      };

      activeProjectData.scenes[activeSceneKey].initialLook = newViewpoint;

      if (viewer && typeof viewer.tweenControlCenter === 'function') {
        viewer.tweenControlCenter(new THREE.Vector3(newViewpoint.x, newViewpoint.y, newViewpoint.z), 800);
      }

      showToast(`Saved view angle for [${activeSceneKey}]`, "success");
    }

    function deleteActiveRoom() {
      if (!activeSceneKey) return;

      if (!confirm(`Are you sure you want to delete room "${activeSceneKey}"?`)) return;

      if (panoCache[activeSceneKey]) {
        viewer.remove(panoCache[activeSceneKey]);
        if (panoCache[activeSceneKey].dispose) {
          panoCache[activeSceneKey].dispose();
        }
        delete panoCache[activeSceneKey];
      }

      delete activeProjectData.scenes[activeSceneKey];

      const remainingKeys = Object.keys(activeProjectData.scenes);
      if (remainingKeys.length > 0) {
        if (activeProjectData.initialScene === activeSceneKey) {
          activeProjectData.initialScene = remainingKeys[0];
        }
        rebuildInterfaceDropdowns();
        switchActiveRoom(remainingKeys[0]);
      } else {
        activeProjectData.initialScene = "";
        activeSceneKey = "";
        currentPanoObj = null;
        rebuildInterfaceDropdowns();
        renderHotspotsManagementList();
      }
      
      showToast("Room deleted.", "info");
    }

    // =========================================================================
    // PORTAL HOTSPOT MANAGEMENT
    // =========================================================================
    function addHotspotToRoom() {
      if (!currentClickedVector || !activeSceneKey) return;

      const targetScene = document.getElementById('target-scene-selector').value;
      const customLabel = document.getElementById('hotspot-label-input').value.trim();

      if (!targetScene) {
        showToast("Select a destination room.", "error");
        return;
      }

      const targetTitle = activeProjectData.scenes[targetScene]?.title || targetScene;

      const newHotspot = {
        x: currentClickedVector.x,
        y: currentClickedVector.y,
        z: currentClickedVector.z,
        // Dual mapping to maintain backwards support for legacy pitch/yaw/distance fields
        pitch: currentClickedVector.x,
        yaw: currentClickedVector.y,
        distance: currentClickedVector.z,
        targetScene: targetScene,
        label: customLabel || `Go to: ${targetTitle}`
      };

      if (!activeProjectData.scenes[activeSceneKey].hotspots) {
        activeProjectData.scenes[activeSceneKey].hotspots = [];
      }

      activeProjectData.scenes[activeSceneKey].hotspots.push(newHotspot);
      document.getElementById('hotspot-label-input').value = '';
      renderActivePano();
      showToast("Navigation portal placed!", "success");
    }

    function drawHotspotsToWorkspace() {
      if (!currentPanoObj) return;

      if (currentPanoObj.children) {
        const existingSpots = currentPanoObj.children.filter(c => c instanceof PANOLENS.Infospot);
        existingSpots.forEach(spot => currentPanoObj.remove(spot));
      }

      const sceneData = activeProjectData.scenes[activeSceneKey];
      if (!sceneData || !sceneData.hotspots) return;

      sceneData.hotspots.forEach((spot) => {
        const infospot = new PANOLENS.Infospot(350, PANOLENS.DataImage.Arrow);
        
        // Support both Cartesian x/y/z and legacy pitch/yaw/distance schema
        const posX = spot.x !== undefined ? spot.x : spot.pitch;
        const posY = spot.y !== undefined ? spot.y : spot.yaw;
        const posZ = spot.z !== undefined ? spot.z : spot.distance;

        infospot.position.set(posX, posY, posZ);
        
        const labelText = spot.label || `Portal to: ${spot.targetScene}`;
        infospot.addHoverText(labelText);

        infospot.addEventListener('click', () => {
          switchActiveRoom(spot.targetScene);
        });

        currentPanoObj.add(infospot);
      });
    }

    function renderHotspotsManagementList() {
      const listEl = document.getElementById('hotspots-list');
      listEl.innerHTML = '';

      const sceneData = activeProjectData.scenes[activeSceneKey];
      if (!sceneData || !sceneData.hotspots || sceneData.hotspots.length === 0) {
        listEl.innerHTML = '<li style="font-size:0.8rem; color:var(--text-muted);">No portals created in this room.</li>';
        return;
      }

      sceneData.hotspots.forEach((spot, index) => {
        const li = document.createElement('li');
        li.className = 'hotspot-item';
        const displayLabel = spot.label || `➔ ${spot.targetScene}`;
        li.innerHTML = `
          <span title="${displayLabel}">${displayLabel}</span>
          <button class="danger" onclick="removeHotspotByIndex(${index})">Remove</button>
        `;
        listEl.appendChild(li);
      });
    }

    function removeHotspotByIndex(index) {
      if (!activeSceneKey || !activeProjectData.scenes[activeSceneKey]) return;
      activeProjectData.scenes[activeSceneKey].hotspots.splice(index, 1);
      renderActivePano();
      showToast("Portal removed", "info");
    }

    // =========================================================================
    // UI DROPDOWN HELPERS
    // =========================================================================
    function rebuildInterfaceDropdowns() {
      const sceneSelect = document.getElementById('scene-selector');
      const targetSelect = document.getElementById('target-scene-selector');

      sceneSelect.innerHTML = '';
      targetSelect.innerHTML = '';

      const keys = Object.keys(activeProjectData.scenes);

      keys.forEach(key => {
        const isStart = (key === activeProjectData.initialScene) ? " ★ (Start)" : "";
        const title = activeProjectData.scenes[key].title || key;
        
        const option1 = document.createElement('option');
        option1.value = key;
        option1.textContent = `${title} [${key}]${isStart}`;
        sceneSelect.appendChild(option1);

        const option2 = document.createElement('option');
        option2.value = key;
        option2.textContent = `${title} [${key}]`;
        targetSelect.appendChild(option2);
      });

      if (activeSceneKey && keys.includes(activeSceneKey)) {
        sceneSelect.value = activeSceneKey;
      }
    }

    // =========================================================================
    // CLOUD DATABASE SYNC
    // =========================================================================
    async function loadProjectFromCloud() {
      try {
        showLoadingOverlay("Fetching tour data from Cloud...");
        const docRef = db.collection('projects').doc(projectId);

        let docSnap;
        try {
          docSnap = await docRef.get();
        } catch (netErr) {
          console.warn("Live network request failed. Checking cache...", netErr);
          try {
            docSnap = await docRef.get({ source: 'cache' });
          } catch (cacheErr) {
            throw new Error("Could not connect to Firestore backend.");
          }
        }

        if (docSnap && docSnap.exists) {
          activeProjectData = docSnap.data();
          rebuildInterfaceDropdowns();

          if (activeProjectData.initialScene && activeProjectData.scenes[activeProjectData.initialScene]) {
            await switchActiveRoom(activeProjectData.initialScene);
          } else if (Object.keys(activeProjectData.scenes).length > 0) {
            await switchActiveRoom(Object.keys(activeProjectData.scenes)[0]);
          } else {
            hideLoadingOverlay();
          }
        } else {
          hideLoadingOverlay();
          showToast(`Ready for new scenes in project "${projectId}"`, "info");
        }
      } catch (err) {
        console.error("Firestore Load Error:", err);
        hideLoadingOverlay();
        showToast("Database Warning: " + err.message, "error");
      }
    }

    async function saveProjectToCloud() {
      const saveBtn = document.getElementById('cloud-save-btn');
      saveBtn.disabled = true;
      saveBtn.innerText = "Saving...";
      
      try {
        const timeoutPromise = new Promise((_, reject) => 
          setTimeout(() => reject(new Error("Save request timed out.")), 10000)
        );
        
        const savePromise = db.collection('projects').doc(projectId).set(activeProjectData, { merge: true });
        
        await Promise.race([savePromise, timeoutPromise]);
        showToast("All project changes saved!", "success");
      } catch (err) {
        console.error("Firestore Save Error:", err);
        showToast("Save failed: " + err.message, "error");
      } finally {
        saveBtn.disabled = false;
        saveBtn.innerText = "Save All Changes";
      }
    }
  </script>
</body>
</html>
