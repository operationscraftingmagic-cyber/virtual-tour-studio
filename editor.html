<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>360° Virtual Tour Editor</title>

  <!-- Node.js 'process' Polyfill for Browser Compatibility -->
  <script>
    window.process = { env: { NODE_ENV: 'production' } };
  </script>

  <!-- Core Libraries -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r105/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/panolens@0.12.1/build/panolens.min.js"></script>
  
  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #121212;
      color: #e0e0e0;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }
    header {
      background-color: #1e1e1e;
      padding: 12px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #333;
      z-index: 10;
    }
    header h1 {
      font-size: 1.1rem;
      color: #00e676;
    }
    .header-btns {
      display: flex;
      gap: 10px;
    }
    #editor-container {
      display: flex;
      flex: 1;
      height: calc(100vh - 55px);
      position: relative;
      width: 100%;
      overflow: hidden;
    }
    #viewer-canvas {
      flex: 1;
      height: 100%;
      width: 100%;
      background-color: #000;
      position: relative;
    }
    /* Enforce canvas sizing */
    #viewer-canvas canvas {
      width: 100% !important;
      height: 100% !important;
      position: absolute;
      top: 0;
      left: 0;
      outline: none;
    }
    #loading-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.85);
      color: #00e676;
      font-size: 1.1rem;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 50;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }
    #control-panel {
      width: 380px;
      background-color: #181818;
      border-left: 1px solid #2e2e2e;
      padding: 20px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 20px;
      z-index: 10;
    }
    .panel-section {
      background-color: #222;
      padding: 15px;
      border-radius: 8px;
      border: 1px solid #333;
    }
    .panel-section h3 {
      font-size: 0.9rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #888;
      margin-bottom: 12px;
    }
    .input-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 12px;
    }
    label {
      font-size: 0.8rem;
      color: #aaa;
    }
    input[type="text"], input[type="file"], select {
      background-color: #121212;
      border: 1px solid #3a3a3a;
      color: #fff;
      padding: 8px 12px;
      border-radius: 4px;
      font-size: 0.9rem;
      width: 100%;
    }
    input[type="file"] {
      padding: 6px;
      cursor: pointer;
    }
    button {
      background-color: #2979ff;
      color: white;
      border: none;
      padding: 10px 14px;
      border-radius: 4px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
      width: 100%;
    }
    button:hover {
      background-color: #1565c0;
    }
    button.secondary {
      background-color: #333;
      color: #ccc;
    }
    button.secondary:hover {
      background-color: #444;
    }
    button.danger {
      background-color: #d32f2f;
    }
    button.danger:hover {
      background-color: #9a0007;
    }
    button.success {
      background-color: #00c853;
    }
    button.success:hover {
      background-color: #009624;
    }
    button:disabled {
      background-color: #444;
      cursor: not-allowed;
      opacity: 0.6;
    }
    .hotspot-list {
      list-style: none;
      margin-top: 8px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .hotspot-item {
      background-color: #1a1a1a;
      padding: 8px 10px;
      border-radius: 4px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.85rem;
      border: 1px solid #2a2a2a;
    }
    .hotspot-item button {
      width: auto;
      padding: 4px 8px;
      font-size: 0.75rem;
    }
    .coord-badge {
      font-family: monospace;
      font-size: 0.8rem;
      color: #ffb74d;
      background: #2a2010;
      padding: 4px 8px;
      border-radius: 4px;
      display: inline-block;
      margin-bottom: 8px;
    }
    .row {
      display: flex;
      gap: 8px;
    }

    /* Panolens Hover Tooltip Glow Style */
    .panolens-infospot-tooltip {
      background: rgba(18, 18, 18, 0.9) !important;
      border: 1px solid #00e676 !important;
      box-shadow: 0 0 15px rgba(0, 230, 118, 0.4), inset 0 0 10px rgba(41, 121, 255, 0.2) !important;
      color: #ffffff !important;
      font-weight: 600 !important;
      border-radius: 20px !important;
      padding: 6px 14px !important;
      letter-spacing: 0.5px !important;
      backdrop-filter: blur(8px) !important;
    }
  </style>
</head>
<body>

  <header>
    <h1>Virtual Tour Studio (Editor)</h1>
    <div class="header-btns">
      <button class="secondary" id="back-dashboard-btn" style="width:auto;">Dashboard</button>
      <button class="secondary" id="live-presentation-btn" style="width:auto;">Preview Tour</button>
      <button class="success" id="cloud-save-btn" style="width:auto;">Save All Changes</button>
    </div>
  </header>

  <div id="editor-container">
    <!-- 360 Canvas -->
    <div id="viewer-canvas">
      <div id="loading-overlay" style="display:none;">
        <span id="loading-text">Loading 360° Scene...</span>
      </div>
    </div>

    <!-- Control Panel -->
    <div id="control-panel">

      <!-- SECTION 1: ADD NEW ROOM -->
      <div class="panel-section">
        <h3>1. Add New Room Scene</h3>
        <div class="input-group">
          <label for="scene-id-input">Room ID (e.g. living_room):</label>
          <input type="text" id="scene-id-input" placeholder="living_room">
        </div>
        <div class="input-group">
          <label for="scene-file-input">360° Panorama Image File:</label>
          <input type="file" id="scene-file-input" accept="image/jpeg, image/png">
        </div>
        <button id="add-scene-btn" onclick="uploadAndAddScene()">Upload & Add Room</button>
      </div>

      <!-- SECTION 2: ACTIVE ROOM MANAGEMENT -->
      <div class="panel-section">
        <h3>2. Active Room Settings</h3>
        <div class="input-group">
          <label for="scene-selector">Select Active Editing Room:</label>
          <select id="scene-selector"></select>
        </div>
        
        <div class="row" style="margin-bottom: 8px;">
          <button class="secondary" id="set-start-scene-btn">Set as Start Room</button>
          <button class="secondary" id="set-default-view-btn">Save View Angle</button>
        </div>

        <div class="row">
          <button class="danger" id="delete-scene-btn">Delete Active Room</button>
        </div>
      </div>

      <!-- SECTION 3: CREATE HOTSPOT -->
      <div class="panel-section">
        <h3>3. Place Portal Hotspot</h3>
        <p style="font-size:0.8rem; color:#aaa; margin-bottom:10px;">
          Click anywhere on the 360° photo to set portal target position.
        </p>
        <div>Selected Target: <span id="click-coords" class="coord-badge">Click photo to select</span></div>
        
        <div class="input-group">
          <label for="target-scene-selector">Target Destination Room:</label>
          <select id="target-scene-selector"></select>
        </div>
        
        <button id="add-hotspot-btn" disabled>Add Navigation Portal</button>
      </div>

      <!-- SECTION 4: EXISTING HOTSPOTS -->
      <div class="panel-section">
        <h3>4. Portals in this Room</h3>
        <ul id="hotspots-list" class="hotspot-list"></ul>
      </div>

    </div>
  </div>

  <script>
    // =========================================================================
    // CONFIGURATION & CUSTOM ICONS
    // =========================================================================
    
    const CLOUDINARY_CLOUD_NAME = "dxfuktuw";
    const CLOUDINARY_UPLOAD_PRESET = "virtualtour";

    // =========================================================================
    // GLOWING HOTSPOT ICON (Expanded Bounds & High-Luminance WebGL Glow)
    // =========================================================================
    const HOTSPOT_CUSTOM_ICON = 'data:image/svg+xml;utf8,' + encodeURIComponent(`
      <svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
        <defs>
          <!-- Wide-spread Neon Blur Filter -->
          <filter id="neon-glow" x="-100%" y="-100%" width="300%" height="300%">
            <feGaussianBlur stdDeviation="6" result="blur1" />
            <feGaussianBlur stdDeviation="16" result="blur2" />
            <feMerge>
              <feMergeNode in="blur2" />
              <feMergeNode in="blur1" />
              <feMergeNode in="SourceGraphic" />
            </feMerge>
          </filter>

          <!-- High-Contrast Neon Gradient -->
          <linearGradient id="glow-grad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#00e676" />
            <stop offset="50%" stop-color="#2979ff" />
            <stop offset="100%" stop-color="#00e676" />
          </linearGradient>

          <!-- Radial Background Glow Aura -->
          <radialGradient id="aura-glow" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#00e676" stop-opacity="0.6" />
            <stop offset="60%" stop-color="#2979ff" stop-opacity="0.2" />
            <stop offset="100%" stop-color="#000000" stop-opacity="0" />
          </radialGradient>
        </defs>

        <!-- Outer Radiant Glow Disk -->
        <circle cx="128" cy="128" r="90" fill="url(#aura-glow)" />

        <!-- Neon Glow Outer Ring -->
        <circle cx="128" cy="128" r="54" fill="none" stroke="url(#glow-grad)" stroke-width="8" filter="url(#neon-glow)" />

        <!-- Inner Dark Glass Core -->
        <circle cx="128" cy="128" r="44" fill="rgba(12, 12, 12, 0.92)" stroke="#00e676" stroke-width="3" filter="url(#neon-glow)" />

        <!-- Bright Core Arrow -->
        <path d="M128 92 L150 122 L138 122 L138 152 L118 152 L118 122 L106 122 Z" fill="#00e676" filter="url(#neon-glow)" />
      </svg>
    `);

    const firebaseConfig = {
      apiKey: "AIzaSyDh-u_fBujEDL2qJoypFrMyvYzhIeUDuWY",
      authDomain: "virtualtour-54c99.firebaseapp.com",
      projectId: "virtualtour-54c99",
      storageBucket: "virtualtour-54c99.firebasestorage.app",
      messagingSenderId: "52412538071",
      appId: "1:52412538071:web:eb9799ac8ebac146cbe492"
    };

    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }
    const db = firebase.firestore();

    // Force Long-Polling to bypass WebSocket/gRPC backend connection timeouts
    db.settings({ 
      experimentalForceLongPolling: true 
    });

    const urlParams = new URLSearchParams(window.location.search);
    const projectId = urlParams.get('project') || 'demo_tour';

    let activeProjectData = {
      initialScene: "",
      scenes: {}
    };

    let activeSceneKey = "";
    let viewer = null;
    let currentPanoObj = null;
    let currentClickedVector = null;
    const panoCache = {};

    // =========================================================================
    // INITIALIZATION
    // =========================================================================
    window.addEventListener('DOMContentLoaded', async () => {
      const container = document.getElementById('viewer-canvas');

      viewer = new PANOLENS.Viewer({
        container: container,
        autoHideInfospot: false,
        controlBar: true
      });

      window.addEventListener('resize', () => {
        if (viewer) viewer.onWindowResize();
      });

      // Capture Clicked 3D Coordinates via Raycaster
      container.addEventListener('click', (event) => {
        if (!viewer || !currentPanoObj) return;

        const rect = container.getBoundingClientRect();
        const mouse = new THREE.Vector2(
          ((event.clientX - rect.left) / container.clientWidth) * 2 - 1,
          -((event.clientY - rect.top) / container.clientHeight) * 2 + 1
        );

        const raycaster = new THREE.Raycaster();
        raycaster.setFromCamera(mouse, viewer.getCamera());
        
        const intersects = raycaster.intersectObject(currentPanoObj, true);

        if (intersects.length > 0) {
          const pt = intersects[0].point;
          currentClickedVector = new THREE.Vector3(-Math.round(pt.x), Math.round(pt.y), Math.round(pt.z));
          
          document.getElementById('click-coords').innerText = 
            `X: ${currentClickedVector.x}, Y: ${currentClickedVector.y}, Z: ${currentClickedVector.z}`;
          
          document.getElementById('add-hotspot-btn').disabled = false;
        }
      });

      // UI Button Bindings
      document.getElementById('scene-selector').addEventListener('change', (e) => switchActiveRoom(e.target.value));
      document.getElementById('set-start-scene-btn').addEventListener('click', setStartRoom);
      document.getElementById('set-default-view-btn').addEventListener('click', captureDefaultViewpoint);
      document.getElementById('add-hotspot-btn').addEventListener('click', addHotspotToRoom);
      document.getElementById('delete-scene-btn').addEventListener('click', deleteActiveRoom);
      document.getElementById('cloud-save-btn').addEventListener('click', saveProjectToCloud);
      document.getElementById('back-dashboard-btn').addEventListener('click', () => window.location.href = 'dashboard.html');
      document.getElementById('live-presentation-btn').addEventListener('click', () => window.location.href = `view_project.html?project=${projectId}`);

      await loadProjectFromCloud();
    });

    // =========================================================================
    // HELPER: PRELOAD PANORAMA IMAGE (Prevents texImage2D error)
    // =========================================================================
    function preloadImage(url) {
      return new Promise((resolve, reject) => {
        const img = new Image();
        img.crossOrigin = "anonymous";
        img.onload = () => resolve(img);
        img.onerror = () => reject(new Error("Image failed to load or cross-origin policy blocked access."));
        img.src = url;
      });
    }

    function showLoadingOverlay(msg) {
      const el = document.getElementById('loading-overlay');
      document.getElementById('loading-text').innerText = msg || "Loading...";
      el.style.display = 'flex';
      el.style.opacity = '1';
    }

    function hideLoadingOverlay() {
      const el = document.getElementById('loading-overlay');
      el.style.opacity = '0';
      setTimeout(() => { el.style.display = 'none'; }, 300);
    }

    // =========================================================================
    // CLOUDINARY UPLOAD HANDLER
    // =========================================================================
    async function uploadAndAddScene() {
      const fileInput = document.getElementById('scene-file-input');
      const rawIdInput = document.getElementById('scene-id-input');
      const addBtn = document.getElementById('add-scene-btn');

      const rawId = rawIdInput.value.trim();
      let file = fileInput.files[0];

      if (!rawId || !file) {
        alert("Please provide both a Room ID and select a 360° image file.");
        return;
      }

      const cleanId = rawId.toLowerCase().replace(/[^a-z0-9]/g, '_');
      
      addBtn.disabled = true;
      addBtn.innerText = "Uploading to Cloudinary...";

      try {
        const formData = new FormData();
        formData.append('file', file);
        formData.append('upload_preset', CLOUDINARY_UPLOAD_PRESET);

        const res = await fetch(`https://api.cloudinary.com/v1_1/${CLOUDINARY_CLOUD_NAME}/image/upload`, {
          method: 'POST',
          body: formData
        });

        const data = await res.json();
        if (!res.ok) throw new Error(data.error?.message || "Upload failed");

        const downloadURL = data.secure_url;

        activeProjectData.scenes[cleanId] = {
          image: downloadURL,
          hotspots: []
        };

        if (!activeProjectData.initialScene) {
          activeProjectData.initialScene = cleanId;
        }

        rebuildInterfaceDropdowns();
        switchActiveRoom(cleanId);

        rawIdInput.value = '';
        fileInput.value = '';
        alert("Room uploaded and added successfully!");

      } catch (error) {
        console.error("Cloudinary upload error:", error);
        alert("Upload failed: " + error.message);
      } finally {
        addBtn.disabled = false;
        addBtn.innerText = "Upload & Add Room";
      }
    }

    // =========================================================================
    // ROOM & PANORAMA MANAGEMENT
    // =========================================================================
    function switchActiveRoom(roomKey) {
      if (!activeProjectData.scenes[roomKey]) return;
      activeSceneKey = roomKey;
      document.getElementById('scene-selector').value = roomKey;
      renderActivePano();
    }

    async function renderActivePano() {
      const sceneData = activeProjectData.scenes[activeSceneKey];
      if (!sceneData || !sceneData.image) return;

      showLoadingOverlay("Preloading 360° Image...");

      try {
        if (!panoCache[activeSceneKey]) {
          const loadedImg = await preloadImage(sceneData.image);
          const newPano = new PANOLENS.ImagePanorama(loadedImg.src);

          newPano.addEventListener('load', () => {
            hideLoadingOverlay();
            if (viewer) viewer.onWindowResize();
          });

          panoCache[activeSceneKey] = newPano;
          viewer.add(newPano);
        }

        currentPanoObj = panoCache[activeSceneKey];
        viewer.setPanorama(currentPanoObj);

        setTimeout(() => {
          if (viewer) viewer.onWindowResize();
          hideLoadingOverlay();
        }, 300);

        drawHotspotsToWorkspace();
        renderHotspotsManagementList();

        if (sceneData.initialLook && !isNaN(sceneData.initialLook.x)) {
          const look = sceneData.initialLook;
          const targetVector = new THREE.Vector3(look.x, look.y, look.z);
          setTimeout(() => {
            if (viewer && typeof viewer.tweenControlCenter === 'function') {
              viewer.tweenControlCenter(targetVector, 0);
            }
          }, 400);
        }

      } catch (err) {
        hideLoadingOverlay();
        console.error("Panorama rendering error:", err);
        alert("Could not load image: " + err.message);
      }

      currentClickedVector = null;
      document.getElementById('click-coords').innerText = "Click photo to select";
      document.getElementById('add-hotspot-btn').disabled = true;
    }

    function setStartRoom() {
      if (!activeSceneKey) return;
      activeProjectData.initialScene = activeSceneKey;
      alert(`Room [${activeSceneKey}] set as initial starting scene.`);
    }

    function captureDefaultViewpoint() {
      if (!viewer || !activeSceneKey || !activeProjectData.scenes[activeSceneKey]) {
        alert("Please select an active room scene first.");
        return;
      }

      let targetVector = new THREE.Vector3();

      if (viewer && viewer.control && typeof viewer.control.getCenter === 'function') {
        targetVector = viewer.control.getCenter();
      } else if (viewer && typeof viewer.getControlCenter === 'function') {
        targetVector = viewer.getControlCenter();
      } else if (viewer && viewer.getCamera()) {
        const dir = new THREE.Vector3();
        viewer.getCamera().getWorldDirection(dir);
        targetVector = dir.multiplyScalar(1000);
      }

      if (!targetVector || isNaN(targetVector.x)) {
        alert("Unable to read camera position. Rotate the view and try again.");
        return;
      }

      const lookVector = {
        x: parseFloat(targetVector.x.toFixed(2)),
        y: parseFloat(targetVector.y.toFixed(2)),
        z: parseFloat(targetVector.z.toFixed(2))
      };

      activeProjectData.scenes[activeSceneKey].initialLook = lookVector;
      alert(`Default view angle saved for "${activeSceneKey.replace(/_/g, ' ')}"! Remember to click "Save All Changes".`);
    }

    function deleteActiveRoom() {
      if (!activeSceneKey) return;

      if (!confirm(`Are you sure you want to delete room "${activeSceneKey}"?`)) return;

      if (panoCache[activeSceneKey]) {
        viewer.remove(panoCache[activeSceneKey]);
        delete panoCache[activeSceneKey];
      }

      delete activeProjectData.scenes[activeSceneKey];

      const remainingKeys = Object.keys(activeProjectData.scenes);
      if (remainingKeys.length > 0) {
        if (activeProjectData.initialScene === activeSceneKey) {
          activeProjectData.initialScene = remainingKeys[0];
        }
        rebuildInterfaceDropdowns();
        switchActiveRoom(remainingKeys[0]);
      } else {
        activeProjectData.initialScene = "";
        activeSceneKey = "";
        currentPanoObj = null;
        rebuildInterfaceDropdowns();
        renderHotspotsManagementList();
      }
    }

    // =========================================================================
    // HOTSPOT PORTAL LOGIC
    // =========================================================================
    function addHotspotToRoom() {
      if (!currentClickedVector || !activeSceneKey) return;

      const targetScene = document.getElementById('target-scene-selector').value;
      if (!targetScene) {
        alert("Please select a target destination room.");
        return;
      }

      const newHotspot = {
        pitch: currentClickedVector.x,
        yaw: currentClickedVector.y,
        distance: currentClickedVector.z,
        targetScene: targetScene
      };

      if (!activeProjectData.scenes[activeSceneKey].hotspots) {
        activeProjectData.scenes[activeSceneKey].hotspots = [];
      }

      activeProjectData.scenes[activeSceneKey].hotspots.push(newHotspot);
      renderActivePano();
    }

    function drawHotspotsToWorkspace() {
      if (!currentPanoObj) return;

      if (currentPanoObj.children) {
        const existingSpots = currentPanoObj.children.filter(c => c instanceof PANOLENS.Infospot);
        existingSpots.forEach(spot => currentPanoObj.remove(spot));
      }

      const sceneData = activeProjectData.scenes[activeSceneKey];
      if (!sceneData || !sceneData.hotspots) return;

      sceneData.hotspots.forEach((spot) => {
        const infospot = new PANOLENS.Infospot(350, HOTSPOT_CUSTOM_ICON);
        infospot.position.set(spot.pitch, spot.yaw, spot.distance);
        infospot.addHoverText(`Portal to: ${spot.targetScene}`);

        infospot.addEventListener('click', () => {
          switchActiveRoom(spot.targetScene);
        });

        currentPanoObj.add(infospot);
      });
    }

    function renderHotspotsManagementList() {
      const listEl = document.getElementById('hotspots-list');
      listEl.innerHTML = '';

      const sceneData = activeProjectData.scenes[activeSceneKey];
      if (!sceneData || !sceneData.hotspots || sceneData.hotspots.length === 0) {
        listEl.innerHTML = '<li style="font-size:0.8rem; color:#666;">No portals in this room yet.</li>';
        return;
      }

      sceneData.hotspots.forEach((spot, index) => {
        const li = document.createElement('li');
        li.className = 'hotspot-item';
        li.innerHTML = `
          <span>➔ <strong>${spot.targetScene}</strong></span>
          <button class="danger" onclick="removeHotspotByIndex(${index})">Remove</button>
        `;
        listEl.appendChild(li);
      });
    }

    function removeHotspotByIndex(index) {
      if (!activeSceneKey || !activeProjectData.scenes[activeSceneKey]) return;
      activeProjectData.scenes[activeSceneKey].hotspots.splice(index, 1);
      renderActivePano();
    }

    // =========================================================================
    // UI DROPDOWN HELPERS
    // =========================================================================
    function rebuildInterfaceDropdowns() {
      const sceneSelect = document.getElementById('scene-selector');
      const targetSelect = document.getElementById('target-scene-selector');

      sceneSelect.innerHTML = '';
      targetSelect.innerHTML = '';

      const keys = Object.keys(activeProjectData.scenes);

      keys.forEach(key => {
        const isStart = (key === activeProjectData.initialScene) ? " ★(Start)" : "";
        
        const option1 = document.createElement('option');
        option1.value = key;
        option1.textContent = `${key}${isStart}`;
        sceneSelect.appendChild(option1);

        const option2 = document.createElement('option');
        option2.value = key;
        option2.textContent = key;
        targetSelect.appendChild(option2);
      });

      if (activeSceneKey && keys.includes(activeSceneKey)) {
        sceneSelect.value = activeSceneKey;
      }
    }

    // =========================================================================
    // CLOUD DATABASE FIRESTORE SYNC WITH FALLBACKS
    // =========================================================================
    async function loadProjectFromCloud() {
      try {
        showLoadingOverlay("Fetching tour data from Firestore...");
        const docRef = db.collection('projects').doc(projectId);

        let docSnap;
        try {
          docSnap = await docRef.get();
        } catch (netErr) {
          console.warn("Live network request failed. Attempting offline cache...", netErr);
          try {
            docSnap = await docRef.get({ source: 'cache' });
          } catch (cacheErr) {
            throw new Error("Could not connect to Firestore backend and no offline cache exists.");
          }
        }

        if (docSnap && docSnap.exists) {
          activeProjectData = docSnap.data();
          rebuildInterfaceDropdowns();

          if (activeProjectData.initialScene && activeProjectData.scenes[activeProjectData.initialScene]) {
            await switchActiveRoom(activeProjectData.initialScene);
          } else if (Object.keys(activeProjectData.scenes).length > 0) {
            await switchActiveRoom(Object.keys(activeProjectData.scenes)[0]);
          } else {
            hideLoadingOverlay();
          }
        } else {
          console.warn(`No existing project found for ID "${projectId}". Ready for new scenes.`);
          hideLoadingOverlay();
        }
      } catch (err) {
        console.error("Error loading project from Firestore:", err);
        hideLoadingOverlay();
        alert("Database Connection Warning:\n\n" + err.message + "\n\nYou can still work and add rooms, then click 'Save All Changes' once connected.");
      }
    }

    async function saveProjectToCloud() {
      const saveBtn = document.getElementById('cloud-save-btn');
      saveBtn.disabled = true;
      saveBtn.innerText = "Saving...";

      try {
        const timeoutPromise = new Promise((_, reject) => 
          setTimeout(() => reject(new Error("Save operation timed out (10s). Check network or Firestore Security Rules.")), 10000)
        );

        const savePromise = db.collection('projects').doc(projectId).set(activeProjectData, { merge: true });

        await Promise.race([savePromise, timeoutPromise]);
        alert("All project changes saved to Firebase Firestore!");
      } catch (err) {
        console.error("Firestore Save Error:", err);
        alert("Save failed: " + err.message);
      } finally {
        saveBtn.disabled = false;
        saveBtn.innerText = "Save All Changes";
      }
    }
  </script>
</body>
</html>
